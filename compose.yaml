services:
  app:
    build:
      context: .
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-0.44.0}
        GIT_SHA: ${GIT_SHA:-development}
        LOCAL_EMBEDDINGS_MODEL: ${LOCAL_EMBEDDINGS_MODEL:-include}
        # Litestream in the image (lane BACKUP): include (default) or skip.
        LITESTREAM: ${LITESTREAM:-include}
    container_name: mynotes
    restart: unless-stopped
    user: "1000:1000"
    ports:
      # Behind a reverse proxy on this host, publish on localhost only ("127.0.0.1:<host-port>:2026")
      # or firewall the port, so nobody reaches Nook around the proxy (docs/OPERATIONS.md, TRUSTED_PROXY_HOPS).
      - "2026:2026"
      # Behind a proxy on this host, publish on localhost only instead, so only the proxy can connect:
      # - "127.0.0.1:2026:2026"
    environment:
      PORT: "2026"
      DATA_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:2026}
      APP_ORIGINS: ${APP_ORIGINS:-${APP_ORIGIN:-http://localhost:2026}}
      APP_NAME: ${APP_NAME:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      SIGNUP_ROLE: ${SIGNUP_ROLE:-member}
      TOTP_POLICY: ${TOTP_POLICY:-optional}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      VAULT_ENCRYPTION_KEY_FILE: ${VAULT_ENCRYPTION_KEY_FILE:-}
      AGENT_SECRETS_KEY: ${AGENT_SECRETS_KEY:-}
      AGENT_SECRETS_KEY_FILE: ${AGENT_SECRETS_KEY_FILE:-}
      AGENT_ALLOWED_PRIVATE_HOSTS: ${AGENT_ALLOWED_PRIVATE_HOSTS:-}
      AGENT_MAX_CONCURRENT_RUNS: ${AGENT_MAX_CONCURRENT_RUNS:-4}
      AGENT_RUN_TIMEOUT_S: ${AGENT_RUN_TIMEOUT_S:-600}
      AGENT_AUDIT_RETENTION_DAYS: ${AGENT_AUDIT_RETENTION_DAYS:-30}
      AGENT_MCP_STDIO: ${AGENT_MCP_STDIO:-off}
      AGENT_MCP_STDIO_FILE: ${AGENT_MCP_STDIO_FILE:-}
      LOCAL_EMBEDDINGS: ${LOCAL_EMBEDDINGS:-on}
      LOCAL_EMBEDDINGS_DIR: ${LOCAL_EMBEDDINGS_DIR:-}
      AUTH_METHODS: ${AUTH_METHODS:-password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:-}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      MAX_MARKDOWN_BYTES: ${MAX_MARKDOWN_BYTES:-2000000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      USER_STORAGE_QUOTA_BYTES: ${USER_STORAGE_QUOTA_BYTES:-10737418240}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-1073741824}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ACCESS_KEY_ID_FILE: ${S3_ACCESS_KEY_ID_FILE:-}
      S3_SECRET_ACCESS_KEY_FILE: ${S3_SECRET_ACCESS_KEY_FILE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ALLOW_HTTP: ${S3_ALLOW_HTTP:-false}
      S3_TIMEOUT_MS: ${S3_TIMEOUT_MS:-30000}
      # Online backups and Litestream (docs/OPERATIONS.md, Backup and restore).
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-1d}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_TARGET: ${BACKUP_TARGET:-}
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups/}
      BACKUP_S3_SSE: ${BACKUP_S3_SSE:-off}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_ACCESS_KEY_ID_FILE: ${BACKUP_S3_ACCESS_KEY_ID_FILE:-}
      BACKUP_S3_SECRET_ACCESS_KEY_FILE: ${BACKUP_S3_SECRET_ACCESS_KEY_FILE:-}
      BACKUP_S3_ALLOW_HTTP: ${BACKUP_S3_ALLOW_HTTP:-false}
      BACKUP_S3_TIMEOUT_MS: ${BACKUP_S3_TIMEOUT_MS:-30000}
      BACKUP_ALERT_AFTER: ${BACKUP_ALERT_AFTER:-2}
      BACKUP_DRILL_INTERVAL: ${BACKUP_DRILL_INTERVAL:-off}
      LITESTREAM_ENABLED: ${LITESTREAM_ENABLED:-false}
      LITESTREAM_S3_PREFIX: ${LITESTREAM_S3_PREFIX:-litestream/}
      LITESTREAM_RETENTION: ${LITESTREAM_RETENTION:-7d}
      LITESTREAM_METRICS_ADDR: ${LITESTREAM_METRICS_ADDR:-127.0.0.1:9090}
      PUSH_ENABLED: ${PUSH_ENABLED:-auto}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-}
      PUSH_ENDPOINT_HOSTS: ${PUSH_ENDPOINT_HOSTS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_INSTANCE_NAME: ${MAIL_INSTANCE_NAME:-}
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-500}
      MAIL_ALLOW_HTTP_LINKS: ${MAIL_ALLOW_HTTP_LINKS:-false}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # Logs (docs/OPERATIONS.md, Logs): error, warn, info, or debug; pretty or json; slow-request threshold in ms.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      LOG_SLOW_MS: ${LOG_SLOW_MS:-1000}
    volumes:
      - ${MYNOTES_DATA_DIR:-/srv/mynotes}:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2026/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 8s
