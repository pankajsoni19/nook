name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "public/social-preview.png"
      - "public/favicon.svg"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static documentation
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp public/social-preview.png _site/social-preview.png
          cp public/favicon.svg _site/favicon.svg
          mkdir -p _site/images
          cp docs/images/*.png _site/images/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
